[project]
name = "unchained"
version = "0.1.0"
description = "Your hardware, your data, your AI key — Muse over directly-read wearables."
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "playwright>=1.48"]

[project.scripts]
unchained = "unchained.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unchained"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
